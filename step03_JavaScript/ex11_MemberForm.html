<!doctype html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>New Web Project</title>
    <style type="text/css">
      tr th {
        background-color: pink;
      }
      td,
      th {
        padding: 3px;
      }

      div {
        border: 1px red solid;
        width: 200px;
        height: 150px;
      }
    </style>
  </head>
  <body>
    <h1>[ 회원 가입 ]</h1>
    <form name="member" action="http://www.naver.com">
      <table>
        <tr>
          <th>ID</th>
          <td>
            <input type="text" name="id" id="id" />
          </td>
        </tr>

        <tr>
          <th>결과</th>
          <td><input type="text" size="30" name="output" id="output" /></td>
        </tr>
        <tr>
          <th colspan="2">
            <input type="submit" value="전송1" />
            <!-- 전송되는건 폼에다가-->
            <input type="button" value="전송2" />
          </th>
        </tr>
      </table>
    </form>
    <hr />
    <div id="result"></div>

    <script>
      //전송1(submit)을 클릭 하면 유효성 체크 한다.
      document
        .querySelector("[name = member]")
        .addEventListener("submit", function () {
          //전송기능 막는다.
          event.preventDefault();

          // alter(1);
          //id 박스에 값있는지 체크한다
          const idEle = document.querySelector("[name = id]");
          console.log(idEle.value);
          /*
			값을 element에 넣을때
			 1) form 요소에 넣기 - value

			 2) 폼요소를 제외한 ex) p, a, div, span,h1~h6
			  - inneri HTML;마크업 을 사용할때                                                              
			   - innerText : 마크업 없이 문자열 인경우
			*/

          //조회한 value의 값을 결과 input 넣는다
          document.querySelector("[name = output]").value = idEle.value;

          //div 영역에 id의 값 넣기
          //document.querySelector("#result").innerHTML = "<h5>" + idEle.value +"</h5>";
          document.querySelector("#result").innerText =
            "<h5>" + idEle.value + "</h5>"; //마크업을 출력

          //input 값 지우기
          idEle.value = "";

          //id 박스에 커서 놓기
          idEle.focus();
        });

      ///////////////////////////////////////////////
      document
        .querySelector("[type = button]")
        .addEventListener("click", function () {
          //유효성 체크 한 후 모든게 ok라면 전송을 한다.

          const idEle = document.querySelector("#id");
          const outEle = document.getElementById("output");

          if (idEle.value === "") {
            alert("아이디를 입력하세요");
            idEle.focus();
            return;
          }

          if (outEle.value === "") {
            alert("결과에 값 입력하세요.");
            outEle.focus();
            return;
          }
          //폼전송한다.
          document.querySelector("form").submit();
        });
    </script>
  </body>
</html>
