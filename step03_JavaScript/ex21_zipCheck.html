      document.querySelector("#zipcode").addEventListener("change", () => {
        alert(event.target.value);
        let v = event.target.value; // ex) 555-221 경기도 성남시 분당구 분당1동

        let op = opener.document;

        op.querySelector("[name = zip1]").value = v.substring(0, 3);
        op.querySelector("[name = zip2]").value = v.substring(4, 7);
        op.querySelector("[name = addr]").value = v.substring(8);
