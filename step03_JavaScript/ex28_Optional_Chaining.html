  <body>
    <h2>Optinal Chaining 문법</h2>
    <!--
    객체의 속성이나 메소드에 안전하게 접근하기 위한 문법
    : 중첩된 객체구조에서 존재하지 않는 속성을 접근을 해도 오류가 발생하지 않고
      undifiend 를 반환하도록 하는 문법 
    -->

    <script>
      const person1 = {
        //
        name: "hee",
        job: {
          title: "instructor",
          manager: {
            name: "kim",
          },
        },
      };

      const person2 = {
        name: "jang",
      };

      //////////////////////////////////////////////////
      const print = function (p) {
        //전달된 객체의 manager의 이름을 알고 싶다.
        //console.log(p.job.manager.name);

        // if문 이나 && 또는 || 를 이용해서 작성

        // p && P.job && p.job.manager && console.log(p.job.manager.name); //&& : 앞에가 true일때 뒤에꺼 실행

        /*
        if(p){
          if(p.job){
            if(p.job.manager){
              console.log(p.job.manager.name);
            }
          }
        }*/

        let re = p?.job?.manager?.name;
        console.log(re);
      };

      print(person1);
      console.log("------------");
      print(person2);
    </script>
  </body>
