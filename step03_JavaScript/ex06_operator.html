    <h3>연산자를 알아보자</h3>
    <script>
      let i = 10;
      let j = "10";
      document.write("<h3>");
      document.write("i = " + i + ", type = " + typeof i + "<br>");

      //템플릿 문자열 - 변수와 문자열 쉽게 연결해서 출력(빽틱 - `)
      document.write(`j = ${j}, type =${typeof j}<br>`);

      //비교 (같다 == vs === , 같지않다 != vs !==)
      document.write(`${i}==${j} => ${i == j}<br>`); //true
      document.write(`${i}===${j} => ${i === j}<br>`); //false

      document.write(`${i}!=${j} => ${i != j}<br>`); // false
      document.write(`${i}!==${j} => ${i !== j}<hr>`); // true

      document.write(`${i}*${j} => ${i * j}<br>`);
      document.write(`${i}+${j} => ${i + j}<br>`); // + 는 덧셈 외에 연결에 개념이 있어 데이터타입이 다르면 연결시킴
      document.write(`${i}+${j} => ${i + parseInt(j)}<br>`);

      document.write("</h3>");

      //////////////////////////////////////////
      //형변환 함수
      /*
         1) parseInt() : 값안에 문자가 나오기 전까지 숫자를 추출 기능
         2) Number() : 값안에 문자가 포함되어 있으면 NaN결과가 나온다.(Not a Number)
         3) isNaN() : is Not a Number> (숫자가 아니면 true, 숫자이면 false)
         4) parseFloat() : 값안에 문자가 나오기 전까지 실수형 추출기능 
        */

      let data1 = "100";
      let data2 = "100a";
      let data3 = "a100";

      console.log(data1 + 10);
      console.log(data1 * 10);

      console.log(parseInt(data1) + 10);
      console.log(Number(data1) + 10);

      console.log("------------");
      console.log(data2 + 10); //연결
      console.log(data2 * 10); // NaN

      console.log("------------");
      console.log(parseInt(data2)); //100
      console.log(Number(data2)); //NaN

      console.log("------------");
      console.log(parseInt(data3)); //NaN
      console.log(Number(data3)); //NaN

      // isNaN 사용
      if (isNaN(data3)) {
        console.log("숫자 아니다.");
      } else {
        console.log("숫자이다.");
      }

      ///Window(가장 꼭대기 조상) 객체 안에있는 주요 함수( 창역할) ////////////////////
      // 1. 메시지 출력
      alert("로그인되었습니다.^^");

      // 2. 의사를 물어볼때
      let re = confirm("삭제할래요?");
      console.log(`re = ${re}`);

      //3. 사용자 입력값 받을때
      let name = prompt("이름은?", "희정"); //결과가 무조건 String
      console.log(`name=${name}`);
    </script>
