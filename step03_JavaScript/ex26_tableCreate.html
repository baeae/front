<!doctype html>
<html>
  <head>
    <meta charset="EUC-KR" />
    <title>Insert title here</title>
    <style type="text/css">
      table {
        width: 400px;
        border: 1px red solid;
      }
      td,
      th {
        border: 1px gray solid;
      }
      a {
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <h1>테이블 동적으로 생성하기</h1>
    <a href="#" id="add">추가하기</a>

    <table id="table">
      <tr>
        <th>이름</th>
        <th>나이</th>
        <th>삭제하기</th>
        <!-- 삭제를 누르면 민들어진 tr이 사라져야한다. -->
      </tr>
      <!-- 동적으로 tr 추가 또는 제거  -->
      <!-- 노션 동적으로 생성된 element에 이벤트 적용 참고  -->
    </table>

    <script>
      let index = 0;
      document.querySelector("#add").addEventListener("click", () => {
        let table = document.getElementById("table");
        let row = table.insertRow(table.rows.length);
        /*let cell1 = row.insertCell(0);
        let cell2 = row.insertCell(1);
        let cell3 = row.insertCell(2);
        cell1.innerHTML =
          "<input type = 'text' name = 'name' value = '장희정'>";
        cell2.innerHTML = "<input type = 'text' value =  " + index++ + ">";
        cell3.innerHTML = "<input type = 'button' value = '삭제'>";*/

        row.insertCell(0).innerHTML =
          "<input type = 'text' name = 'name' value = '장희정'/>";
        row.insertCell(1).innerHTML =
          `<input type = 'text' value = '${index++}' />`;
        row.insertCell(2).innerHTML = "<input type = 'button' value = '삭제'/>";
        //row.insertCell(2).innerHTML = "<input type = 'button' value = '삭제' onclick = 'del()'/>";
      });

      ///////동적으로 생성된 element 삭제에 이벤트 등록하기//////////////////////////////////////////////////////
      document.body.addEventListener("click", function (event) {
        if (event.target.matches("[value=삭제]")) {
          //matches : 일치하는것을 찾는것
          let tr = event.target.parentElement.parentElement; // button -> td -> tr
          tr.parentElement.removeChild(tr); //tr에 부모를 기준으로 자식을 삭제해라
        }
      });
    </script>
  </body>
</html>
