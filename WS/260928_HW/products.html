<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body></body>
  <script>
    const products = [
      { id: 1, name: "Laptop", price: 1200000, category: "electronics" },
      { id: 2, name: "Phone", price: 800000, category: "electronics" },
      { id: 3, name: "T-shirt", price: 30000, category: "clothing" },
      { id: 4, name: "Keyboard", price: 50000, category: "electronics" },
      { id: 5, name: "Sneakers", price: 90000, category: "clothing" },
    ];

    // 문제01 : 가격이 10만 원 이상인 첫 번째 상품을 찾아 출력하시오 – find().
    // find() : true를 만나는순간 반환하고 끝난다.
    {
      let re = products.filter((product) => product.price >= 100000);
      console.log("10만원 이상인 첫번째 상품");
      console.log(re);
    }
    // 문제02 : 카테고리가 "clothing"인 상품들만 골라 새로운 배열을 만드시오.– filter()
    {
      let re = products.filter((product) => product.category === "clothing");
      console.log("카테고리 : clothing");
      console.log(re);
    }
    // 문제03 : 모든 상품 이름만 추출하여 배열로 만드시오.– map()
    {
      let re = products.map((product) => product.name);
      console.log("모든 상품 이름만 추출");
      console.log(re);
    }
    //문제 04 : 전자제품 중 100 만 원 이상인 상품이 하나라도 있는지 확인하시오. fiter(), some()
    {
      let re = products
        .filter((product) => product.category === "electronics")
        .some((product) => product.price >= 1000000);
      console.log("전자제품 중 100만원 이상인 상품이 하나라도 있는지");
      console.log(re);
    }
    //문제 05 : 모든 상품이 가격 2 만 원 이상인지 확인하시오.- every()
    {
      let re = products.every((product) => product.price >= 20000);
      console.log("카테고리 : clothing");
      console.log(re);
    }
    // 문제 06 : 상품들의 총합 금액을 구하시오.- reduce() 사용, price 누적
    {
      // 0 " 첫번째인자의 촣기값 설정"
      let re = products.reduce((pre, curr) => pre + curr.price, 0);
      console.log("상품들의 총합");
      console.log(re);
    }
    // 문제 07 : 상품 가격 기준으로 오름차순 정렬된 배열을 만들되, 원본 배열도 변경되게 하시오.- sort() (주의: 원본 배열 변경됨)
    {
      let re = products.sort((p1, p2) => p1.price - p2.price);
      console.log("상품 가격 기준 오름차순");
      console.log(re);
    }
    // 문제 08 : 상품 이름을 기준으로 알파벳순으로 정렬하되, 원본 배열은 그대로 유지되게 하시오.- toSorted() , localeCompare()
    // ... : toSorted()랑 같음
    {
      let re = products.toSorted((n1, n2) => n1.name.localeCompare(n2.name));
      console.log("상품이름 기준 정렬");
      console.log(re);
    }
    // 문제 09 : 상품 배열의 처음 3 개만 잘라 새 배열로 반환하시오.- slice(start, end)
    {
      let re = products.slice(0, 3);
      console.log("상품 배열 처음 3개");
      console.log(re);
    }
    //문제 10 : 상품 배열에서 id 가 3 인 상품을 찾아 배열에서 제거하시오.– findIndex()와 splice() 조합
    {
      let re = products.splice(
        products.findIndex((product) => product.id === 3),
        1,
      );
      console.log("id 3인 제품 삭제");
      console.log(re);
    }
  </script>
</html>
