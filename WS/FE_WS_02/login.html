<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IT's KOSTA - login</title>
    <!--디스플레이 인라인요소는 가로와 높이가 먹지 않는다 디스플레이를 인라인-블록으로 바꿔조야 늘어남-->
  </head>
  <body>
    <div id="container">
      <!-- navbar  추가 -->

      <div id="login">
        <h1>Login</h1>
        <form action="" method="post">
          <div class="form-item">
            <!--div 태그로 묶어 주면 css 적용하기 수월하다 묶어주는게 좋다-->
            <label for="id">아이디</label>
            <input type="text" id="id" name="id" />
          </div>

          <div class="form-item">
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" />
          </div>

          <hr />
          <button>로그인</button>
        </form>
      </div>

      <!--footer영역 -->
    </div>
  </body>
</html>
