<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="css/navbar.css" type="text/css" />
    <link rel="stylesheet" href="css/common.css" type="text/css" />
    <link rel="stylesheet" href="css/footer.css" type="text/css" />
    <title>IT's KOSTA - register</title>
    <style>
      main {
        padding: 20px 0px; /*상하 좌우*/
      }
      main h1 {
        text-align: center;
        padding: 5px;
      }

      main form {
        height: 350px;
        border: 1px solid gray;
        padding: 40px;
      }

      main .form-item {
        margin-bottom: 10px;
      }

      main .form-item label {
        display: inline-block;
        width: 150px;
        font-size: 18px;
      }

      main .form-item input {
        font-size: 18px;
        border: 1px skyblue solid;
        width: 200px;
      }

      main form button {
        float: right;
        width: 120px;
        font-size: 18px;
        padding: 5px;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <header>
      <nav>
        <!-- 5개의 메뉴생성 -->
        <ul>
          <li class="logo">
            <a href="index.html"
              ><img src="images/logo.jpg" alt="로고입니다."
            /></a>
          </li>
          <li><a href="./personal.html">개인</a></li>
          <li><a href="busines.html">기업</a></li>
          <li><a href="login.html">로그인</a></li>
          <li><a href="register.html">회원가입</a></li>
        </ul>
      </nav>
    </header>

    <div id="banner">지금 당신의 행복! IT's KOSTA Life!</div>

    <main>
      <h1>Register</h1>
      <form action="index.html" method="post" novalidate="novalidate">
        <!--novalidate : 내가 유효성 체크 해준걸로 할때 자동 유효성 체크를 막아줌 -->
        <div class="form-item">
          <label for="name">이름</label>
          <input
            type="text"
            id="name"
            name="name"
            required="required"
            autofocus
          />
        </div>

        <div class="form-item">
          <label for="email">이메일</label>
          <input type="email" id="email" name="email" required />
          <!-- required : 알아서 유효성 체크해줌-->
        </div>

        <div class="form-item">
          <label for="phone">연락처</label>
          <input type="text" id="phone" name="phone" />
        </div>

        <div class="form-item">
          <label for="password">비밀번호</label>
          <input type="password" id="password" name="password" />
        </div>

        <div class="form-item">
          <label for="password2">비밀번호 확인</label>
          <input type="password" id="password2" name="password2" />
        </div>

        <hr />
        <button type="button" id="id">회원 가입</button>
      </form>
    </main>

    <footer>
      <ul>
        <li>경기도 성남시 오리역 한국소프트웨어진흥협회</li>
        <li>02-0000-0000</li>
      </ul>
    </footer>
    <script>
      document.querySelector("#id").addEventListener("click", function (e) {
        e.preventDefault();

        const name = document.querySelector("[name = name]");
        const email = document.querySelector("[name = email]");
        const phone = document.querySelector("[name = phone]");
        const password = document.querySelector("[name = password]");
        const password2 = document.querySelector("[name = password2]");

        console.log(
          name.value,
          email.value,
          phone.value,
          password.value,
          password2.value,
        );

        if (name.value === "") {
          alert("이름을 입력하세요");
          name.focus();
          return;
        }

        if (email.value === "") {
          alert("이메일을 입력하세요");
          email.focus();
          return;
        } else if (email.value.indexOf("@") === -1) {
          alert("이메일 형식이 아닙니다.");
          email.focus();
          return;
        }

        if (phone.value === "") {
          alert("전화번호를 입력하세요");
          phone.focus();
          return;
        }
        if (password.value === "") {
          alert("비밀번호를 입력하세요");
          password.focus();
          return;
        }
        if (password2.value === "") {
          alert("비밀번호 확인을 입력해주세요");
          password2.focus();
          return;
        }

        if (password.value !== password2.value) {
          alert("비밀번호가 일치하지 않습니다");
          password.value = "";
          password2.value = "";
          password.focus();
          return;
        }

        document.querySelector("form").submit();
      });
    </script>
  </body>
</html>
