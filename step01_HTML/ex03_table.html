<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>table 만들기(3행 2열)</h1>
    <table border="1" width = "200">
        <tr>
            <th>이름</th>
            <th>나이</th>
        </tr>
        <tr>
            <td>희정</td>
            <td>20</td>
        </tr>
        <tr>
            <td>나영</td>
            <td>22</td>
        </tr>
    </table>

    <hr>
    <table border="1" width = "200">
        <caption>열병합</caption>
        <tr>
            <td colspan="2">A</td>
        </tr>
        <tr>
            <td>B</td>
            <td>C</td>
        </tr>
    </table>
    <hr>
    <table border="1"width = "200">
        <caption>행변합</caption>
        <tr>
            <td>a</td>
            <td rowspan="2">b</td>
        </tr>
        <tr>
            <td>c</td>
        </tr>
    </table>
    <hr>
    <table border="1" width = "200">
        <caption>8행 3열</caption>
        <tr>
            <td colspan="3">A</td>
        </tr>
        <tr>
            <td rowspan="3">b</td>
            <td colspan="2">c</td>
        </tr>
        <tr>
            <td>d</td>
            <td>e</td>
        </tr>
        <tr>
            <td>f</td>
            <td>g</td>
        </tr>
        <tr>
            <td colspan="3">h</td>
        </tr>
        <tr>
            <td rowspan="3">i</td>
            <td>j</td>
            <td>k</td>
        </tr>
        <tr>
            <td>e</td>
            <td>f</td>
        </tr>
        <tr>
            <td>g</td>
            <td>h</td>
        </tr>
    </table>
    <hr>
    <h1>The thead, tbody, and tfoot elements</h1>
<table border="1" width = "200">
  <thead>
    <tr>
      <th>Month</th>
      <th>Savings</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>January</td>
      <td>$100</td>
    </tr>
    <tr>
      <td>February</td>
      <td>$80</td>
    </tr>
  </tbody>
  <tfoot>
    <tr>
      <td>Sum</td>
      <td>$180</td>
    </tr>
  </tfoot>
</table>
</body>
</html>
