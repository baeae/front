<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>HTML5에 추가된 폼 요소 속성들</h2>
    <form action="ex01_start.html" method="get">
        <input type="date" name="birthday" min="2026-08-10" max="2026-10-13"><br>
        <input type="text" name = "name" id="name" placeholder="이름입력" required><br>
        <input type="email" name = "email" id = "email" placeholder="이메일입력" required><br>
        <input type="number" name ="age" id = "age">

        <br>
        <!--선택박스-->
        <select name="job" id="job" size="3" multiple>
            <option value="0">--선택--</option>
            <option value="개발자">개발자</option>
            <option value="디자이너" selected>디자이너</option>
            <option value="기획자">기획자</option>
            <option value="DBA">DBA</option>
            <option value="0">--선택--</option>
        </select>

        <br><br>
        <input type="text">

        <br>
        <input list="browsers" name="browser" id="browser">
        <datalist id="browsers">
            <option value="Edge">
            <option value="Firefox">
            <option value="Chrome">
            <option value="Opera">
            <option value="Safari">
        </datalist>
         <input type="submit">

    </form>
                                                                    
</body>
</html>
