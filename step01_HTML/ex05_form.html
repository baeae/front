<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>폼 요소</h1>
    <!--
    action은 전송버튼(submit) 클릭했을대 이동한 서버 주소
    method는 http 요청방식을 뜻함
    method = "get" | post"
    get방식은 폼요소의 값들이 url에 보이면서 전송
    post방식이 폼요소의 값들이 request body에 숨겨져서 전송
    -->
    <form action="ex01_start.html" method="get">
        <label for="id">아이디 : </label> 
        <input type="text" name="id" size="5" maxlength="5" value="jang" id="id">
        <br>
        <label for="pwd">비밀번호 : </label> 
        <input type="password" name="pwd" size="5" maxlength="5" id="pwd">
        <br>
        <label for="name">이름</label>
        <input type="text" name="name"  id="name" disabled value="heejung">

        <br><br>

        <!--
        checkbox 는 멀티선택 가능
        name의 값이 모두 같아도 달라도 상관없다. 단 같게하면
        전송되었을때 또는 자바스크립트에서 배열로 처리 할 수 있어 더 편하다
        -->
        <fieldset>
            <legend>취미</legend>
            <input type="checkbox" name="hobby" value = "등산">등산
            <input type="checkbox" name="hobby" value = "낚시">낚시
            <input type="checkbox" name="hobby" value = "골프">골프
            <input type="checkbox" name="hobby" value = "수영">수영
            <input type="checkbox" name="hobby" value = "놀고먹기">놀고먹기
        </fieldset>

        <!--
        radio는 단일 선택만 가능
        단, 반드시 같은 name로 묶여야만 그중의 하나가 선택된다.
        -->
        <fieldset>
            <legend>성별</legend>
            <input type="radio" name="gender" value="man">남자
            <input type="radio" name="gender" value="woman">여자
        </fieldset>

        <br><br>
        <input type="submit" value="로그인">
        <input type="reset" value="취소">
        <input type="button" value="클릭">

        <br><br>
        <button type="submit">로그인</button>
        <button type="reset">취소</button>
        <button type="button">클릭</button>
        
    </form>
</body>
</html>
