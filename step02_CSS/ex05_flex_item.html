<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            width: 100vw; height: 100vh;
            background-color: aqua;
            display: flex;
        }

        .item{
            width: 100px;
            height: 100px;
            border: 1px solid red; 
            box-sizing: border-box;
        }
        /*
        아이템 사이즈를 결정하는 요소들
        flex-grow: 공간이 남을 때 커지는 비율
        flex-shrink: 공간이 모자를 때 줄어드는 비율
        lex-basis: 아이템의 기본 크기 - 원래 이만큼 크기를 갖고 시작하겠다
        */
        .item1{
            flex-grow: 1;/*남은 공간은 다차지*/
            flex-shrink: 3;
            flex-basis: 200px;
        }
        .item2{
            flex-grow: 1;/*남은 공간은 다차지*/
            flex-shrink: 2;
        }
        .item3{
            flex-grow: 1;/*남은 공간은 다차지*/
            flex-shrink: 1;
        }
        .menu {
            display: flex;

            justify-content: center;

            gap: 30px;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="item item1">1</div>
        <div class="item item2">2</div>
        <div class="item item3">3</div>
    </div>
    <hr>
    <nav class="menu">
        <a href="#">HOME</a>
        <a href="#">HTML</a>
        <a href="#">CSS</a>
        <a href="#">JavaScript</a>
    </nav>
</body>
</html>
