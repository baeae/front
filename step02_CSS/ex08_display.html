<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{width: 100px; height: 100px;}

        .a{background-color: red;}
        .b{
            background-color: green; 
            margin-top: 50px; 
            margin-left: 30px;
            margin-bottom: 30px;
            margin-right: 50px;
        }
        .c{background-color: blue;
            margin: 50px;
        
        }

        span{width: 100px; height: 100px;}/*inline 요소에 적용 안됨*/
        #a{background-color: red;}
        #b{
            background-color: green;
            margin-left: 20px;
            margin-right: 30px;
            margin-top: 10px;
            margin-bottom: 20px;
            /*display: block;*/
            display: inline-block;
        }
        #c{background-color: blue;}
    </style>
</head>
<body>
    <!-- block요소 - div -->
     <div class="a">div1</div>
     <div class="b">div2</div>
     <div class="c">div3</div>

     <hr>
    <!-- in-line요소 - span -->
     <span id="a">span1</span><span id="b">span2</span><span id="c">span3</span>
</body>
</html>
