<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            width: 500px; height: 400px;
            background-color: pink;
        }

        div.main>div{
            width: 80px; height: 80px;
        }

        .a{
            background-color: red;
            z-index: 12; /*z-index는 position이 static이 아닌경우*/
            position: relative;
        }
        /*
        position:relative; 요소가 원래 놓여야 할 위치를 기준으로 이동
                            다음에 오는 요소는 어디에 위치하는지?

        position:absolute; 기준이 되는 조상(부모) 요소를 기준으로 배치 
                            다음에 오는 요소는 어디에 위치하는지 ?
        */
        .b{
            background-color: green;
            position: absolute;
            top: 50px;
            left: 20px;
            z-index: 10;
        }

        .c{
            background-color: blue;
            position: relative;
            left: 40px;
            top: 10px;
            z-index: 11;
        }

        .todayView{
            width: 150px; height: 200px;
            border: inset 3px skyblue;
            box-sizing: border-box;
            position: fixed;
            right: 20px;
            top: 20px;
        }

    </style>
</head>
<body>
    <div class="main">
        <div class="a">1</div>
        <div class="b">2</div>
        <div class="c">3</div>
    </div>

    <div class="todayView">
        <h4>오늘 본 상품</h4>
    </div>
