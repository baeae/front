<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      img {
        width: 100%;
        height: 100%;
        border-radius: 10px;
        opacity: 0.7; /*투명도*/
      }

      .main {
        height: 100vh;
        background-color: aliceblue;
        display: grid;
        /*grid-template-columns: 200px 100px 150px;*/
        /*grid-template-columns: repeat(3, 150px) 100px;*/
        grid-template-columns: 1fr 2fr 1fr; /*fraction 사용가능한 공간을 비율로 나눌때 쓰는 단위*/
        /*열을 기준으로 4줄*/
        /*grid-template-rows: 100px auto 150px;*/

        grid-auto-rows: 100px; /*세로길이*/
        row-gap: 10px; /*행의 간격*/
        column-gap: 10px; /*열의 간격*/
      }
      .img1 {
        /*2행 병합*/
        grid-column-start: 1;
        grid-column-end: 3;

        /*3열 병합 */
        grid-row-start: 1;
        grid-row-end: 4;
        /* grid-row-end: -1; -1의 의미는 명시적으로 정의된 Grid의 마지막을 뜻함 */
      }
      .img2 {
        grid-column: 3/4;
        grid-row: 1/4;
      }
      .img3 {
        grid-column: 1/3;
        grid-row: 4 / span 2; /*span : 몇칸을 차지할것인가 ? ex) 2/span 2 2번째 칸부터 2개칸차지*/
      }
    </style>
  </head>
  <body>
    <div class="main">
      <img src="https://picsum.photos/180" alt="" class="img1" />
      <img src="https://picsum.photos/222" alt="" class="img2" />
      <img src="https://picsum.photos/132" alt="" class="img3" />
      <img src="https://picsum.photos/177" alt="" class="img4" />
      <img src="https://picsum.photos/111" alt="" class="img5" />
      <img src="https://picsum.photos/275" alt="" class="img6" />
      <img src="https://picsum.photos/525" alt="" class="img7" />
    </div>
  </body>
</html>
